name: Release

# Tag-driven. `git tag v0.1.5 && git push origin v0.1.5` produces the DMG and
# publishes it on the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release for'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-${{ github.ref_name }}

      # No system-dependency step on macOS: WKWebView ships with the OS and
      # the runner image has the Xcode CLT. The `brew install webkit2gtk
      # javascriptcoregtk libappindicator` block that appears in many Tauri CI
      # examples is Linux-only and would fail here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Code signing
      #
      # Repository secrets for a signed release:
      #   APPLE_CERTIFICATE            base64 of the .p12 (see note below)
      #   APPLE_CERTIFICATE_PASSWORD    password for that .p12
      #
      # tauri-action imports the .p12 into a temporary keychain itself and reads
      # APPLE_SIGNING_IDENTITY to pick the identity, so no extra shell is needed
      # when the secrets are present. Without them the build still runs and the
      # DMG is ad-hoc signed -- see SECURITY.md for why that matters.
      #
      # ---------------------------------------------------------------------
      # Code signing secrets, forwarded only when they actually exist.
      #
      # This indirection is load-bearing. `${{ secrets.APPLE_CERTIFICATE }}`
      # expands to an *empty string* when the secret is not configured, it does
      # not vanish — and the Tauri bundler reads "set but empty" as "there is a
      # certificate to import", runs `security import` on nothing, and aborts:
      #
      #   security: SecKeychainItemImport: One or more parameters passed to a
      #   function were not valid.
      #   failed to bundle project: failed codesign application: failed to run
      #   command security import
      #
      # That lands ~5 minutes into the run, after the release compile, which is
      # an expensive place to learn the repository has no certificate. Writing
      # the variables from a shell step means an unconfigured repository simply
      # never defines them, and the bundler falls back to ad-hoc signing.
      #
      # Repository secrets for a signed build:
      #   APPLE_CERTIFICATE           base64 of the .p12
      #   APPLE_CERTIFICATE_PASSWORD  password for that .p12
      #
      # Create the base64 secret with:
      #   base64 -i ~/keys/clipboard.p12 | pbcopy
      # ---------------------------------------------------------------------
      - name: Forward signing secrets, if any
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "${CERT}" ]; then
            echo "Signing certificate present -- producing a signed DMG."
            echo "APPLE_CERTIFICATE=${CERT}" >> "${GITHUB_ENV}"
            echo "APPLE_CERTIFICATE_PASSWORD=${CERT_PASSWORD}" >> "${GITHUB_ENV}"
          else
            echo "::notice title=Unsigned build::No APPLE_CERTIFICATE secret configured. The DMG will be ad-hoc signed, so the Accessibility permission will not survive a reinstall. See SECURITY.md."
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD come from the step
          # above, via GITHUB_ENV, and are deliberately not listed here.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Clipboard History ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            ## Clipboard History ${{ github.event.inputs.tag || github.ref_name }}

            Apple Silicon (arm64) build. See the [README](https://github.com/navms/clipboard#readme)
            for install instructions and the Accessibility permission setup.

            ### First launch

            This build is code-signed but **not notarized**, so Gatekeeper will
            stop it on the first open. Choose one:

            - Right-click the app → **Open** → **Open**, or
            - run `xattr -dr com.apple.quarantine "/Applications/Clipboard History.app"`

            Double-tap-Option and auto-paste additionally require the
            Accessibility permission: System Settings → Privacy & Security →
            Accessibility → enable **Clipboard History**.
          # Publish on tag push rather than staging a draft. `ci.yml` runs a
          # `Bundle (unsigned smoke build)` job on every push and PR, so the
          # .app is already proven to build before a tag ever reaches this
          # workflow, and a draft only adds a step that has to be remembered --
          # easy to mistake "tagged" for "shipped".
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      # ---------------------------------------------------------------------
      # Notarization — disabled.
      #
      # Requires a paid Apple Developer Program membership and a Developer ID
      # Application certificate; an Apple Development certificate cannot
      # notarize. When you have one, add repository secrets
      #   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
      # and set NOTARIZE: 'true' in the `tauri-action` step above.
      # ---------------------------------------------------------------------
