name: CodeQL

# Requires code scanning to be enabled for the repository. For a private repo
# that means GitHub Advanced Security, which is a paid add-on — a public
# repository gets it for free. Until it is on, the `analyze` step fails while
# uploading SARIF with "Code scanning is not enabled for this repository".
#
# Left in place deliberately: the moment code scanning is turned on this starts
# working, and having it fail loudly is how you find out it is not on.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 03:17 UTC. An arbitrary minute avoids the top-of-hour
    # rush that GitHub's scheduled workflows land in.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  # Uploading SARIF results and updating the PR check needs these. Without
  # them the analysis step runs every query and then fails at the upload with
  # "Resource not accessible by integration", which reads like a CodeQL bug
  # rather than a missing scope.
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      # Order matters and is the opposite of what it looks like: `init` must run
      # before `autobuild`, because the build is what *creates* the database
      # the build-mode declares. Reversed, autobuild reports "Config file could
      # not be found ... Has the 'init' action been called?" and the job fails
      # on a step that looks fine in isolation.
      #
      # Rust is compiled, so it needs a real build for the extractor to trace
      # data flow through. The supported build modes are none / autobuild /
      # manual — there is no `build`, and passing one fails `init` outright.
      # `autobuild` infers the build system and runs cargo build for us, which
      # is why this needs no custom build steps.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'rust' && 'autobuild' || 'none' }}

      - name: Build (for the Rust extractor)
        if: matrix.language == 'rust'
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
