name: CodeQL

# Requires code scanning to be enabled for the repository. For a private repo
# that means GitHub Advanced Security, which is a paid add-on — a public
# repository gets it for free. Until it is on, the `analyze` step fails while
# uploading SARIF with "Code scanning is not enabled for this repository".
#
# Left in place deliberately: the moment code scanning is turned on this starts
# working, and having it fail loudly is how you find out it is not on.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly, Monday 03:17 UTC. An arbitrary minute avoids the top-of-hour
    # rush that GitHub's scheduled workflows land in.
    - cron: '17 3 * * 1'

permissions:
  contents: read
  # Uploading SARIF results and updating the PR check needs these. Without
  # them the analysis step runs every query and then fails at the upload with
  # "Resource not accessible by integration", which reads like a CodeQL bug
  # rather than a missing scope.
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]

    steps:
      - uses: actions/checkout@v4

      # Both languages use `build-mode: none`.
      #
      # Rust does not accept `autobuild` — the action fails `init` outright with
      # "Rust does not support the autobuild build mode. Please try one of the
      # following build modes instead: none", and `build` is not a valid value
      # at all (the modes are none / autobuild / manual). That leaves `none`,
      # which runs the standalone extractor over the sources without tracing a
      # build. The trade-off is real but acceptable here: it is less precise
      # for cross-crate data flow, and in exchange the analysis needs no toolchain
      # and no dependency install, so it cannot break when a crate bumps.
      #
      # `manual` is the other option and would mean a `codeql database create`
      # step of our own plus a separate build; for a project with no custom
      # CodeQL queries that is maintenance for no gain.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
